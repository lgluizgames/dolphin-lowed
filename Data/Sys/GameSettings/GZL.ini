# GZLE01, GZLJ01, GZLP01 - The Legend of Zelda: The Wind Waker
# Dolphin Low-End aggressive performance profile

[Core]
CPUThread = True
DSPHLE = True
OverclockEnable = True
Overclock = 0.60
MMU = False
PauseOnPanic = False
SyncGPU = False
SyncOnSkipIdle = False
FastDiscSpeed = True
GFXBackend = Vulkan

[Video_Settings]
SafeTextureCacheColorSamples = 128
FastDepthCalc = True
MSAA = 1
CPUCull = True
EnableGPUTextureDecoding = False
EnablePixelLighting = False
ShaderCompilationMode = 0
WaitForShadersBeforeStarting = True
ShaderCache = True

[Video_Hacks]
EFBAccessEnable = False
EFBToTextureEnable = True
XFBToTextureEnable = True
DeferEFBCopies = True
SkipDuplicateXFBs = True
EFBScaledCopy = False
BBoxEnable = False
VISkip = False

[Video_Enhancements]
ForceTextureFiltering = 0
ForceTrueColor = False
DisableCopyFilter = True
ArbitraryMipmapDetection = False

[Video_Stereoscopy]
StereoConvergence = 115
